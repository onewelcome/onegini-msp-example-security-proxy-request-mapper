version: 2
registries:
  maven-repository-onewelcome-artifactory:
    type: maven-repository
    url: https://europe-maven.pkg.dev/cpl-iam-p-oip-01/virtual-maven-public
    username: _json_key_base64
    password: "${{secrets.GAR_DEPENDABOT_SA}}"

updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  registries:
  - maven-repository-onewelcome-artifactory
- package-ecosystem: docker
  directory: "/src/main/docker/Dockerfile"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  registries:
  - docker-registry-release-onewelcome-com-443
  - docker-registry-release-onewelcome-com
